[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmap2lanelet"
version = "0.1.0"
description = "Semi-automatic lane-level vector map generation from public map + aerial imagery, exported as Lanelet2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "pyproj>=3.5",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "Pillow>=10.0",
    "rasterio>=1.3",
    "requests>=2.31",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Official Lanelet2 python bindings. Used to *validate* the exported map
# (parse + build a routing graph). The exporter itself has no hard dependency.
lanelet2 = ["lanelet2>=1.2"]
# Optional pretrained-segmentation observation backend.
torch = ["torch>=2.0", "segmentation-models-pytorch>=0.3"]
# Street-level stage: object detection in posed frames, and the rasterisation
# used by the inverse-perspective mosaic.  The geometry, association, export and
# evaluation code needs neither -- only `openmap2lanelet street` does.
street = ["ultralytics>=8.3", "opencv-python>=4.8"]
# Rosbag-based map validation (street/sources/rosbag.py, qa/rosbag_validate.py).
# Both are pure Python; `rosbags` reads a ROS2 bag's own embedded message
# definitions, so no ROS installation is required.
rosbag = ["rosbags>=0.9", "mgrs>=1.4"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
openmap2lanelet = "openmap2lanelet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow. The gate is here to catch things that are *wrong*
# (undefined names, unused imports, shadowed builtins, mutable defaults), not to
# enforce a house style -- a lint job that argues about formatting gets muted.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # `l` reads as a lane throughout this codebase and renaming ~40 sites to
    # satisfy a font-legibility rule would obscure more than it clarifies.
    "E741",
    # zip() strict= is a real hazard in general, but every zip here pairs
    # sequences built from the same source in the same pass.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# The viewer embeds JavaScript and CSS in an f-string; wrapping those lines to
# 100 columns would break the thing it is trying to keep readable.
"src/openmap2lanelet/viz/viewer.py" = ["E501"]
