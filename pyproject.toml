[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmap2lanelet"
version = "0.1.0"
description = "Semi-automatic lane-level vector map generation from public map + aerial imagery, exported as Lanelet2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "networkx>=3.0",
    "pyproj>=3.5",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "Pillow>=10.0",
    "rasterio>=1.3",
    "requests>=2.31",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Official Lanelet2 python bindings. Used to *validate* the exported map
# (parse + build a routing graph). The exporter itself has no hard dependency.
lanelet2 = ["lanelet2>=1.2"]
# Optional pretrained-segmentation observation backend.
torch = ["torch>=2.0", "segmentation-models-pytorch>=0.3"]
dev = ["pytest>=7.4"]

[project.scripts]
gmap2lanelet = "gmap2lanelet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
